<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Practice Log (JS Ver)</title>
    <style>
        h1 { text-align: center; color: #4a4a4a; }
        table { border-collapse: separate; border-spacing: 0; width: auto; margin: 0 auto; min-width: 450px; border: 1px solid #ddd; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        th, td { padding: 8px 4px; border-bottom: 1px solid #ddd; border-left: 1px solid #ddd; text-align: left; vertical-align: top; }
        th { background-color: #4a4a4a; color: white; font-weight: bold; border: none; }
        td { height: auto; }
        .date-row { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: inherit; }
        .day-num { font-weight: bold; }
        .holiday-name { font-size: 0.75em; color: #e74c3c; }
        th:first-child, td:first-child { border-left: none; }
        td:first-child { font-weight: bold; width: auto; color: #333; }
        tbody tr:hover { background-color: #fff9e6; transition: background-color 0.3s; }
        tbody tr:last-child { background-color: #eef9ff; }
        td:nth-child(1) { color: #e74c3c; }
        td:nth-child(7) { color: #3498ad; }
        .holiday { color: #e74c3c; background-color: #fdf2f2; border: 1px solid #f9dcdc; }
        td a { min-height: 1.2em; text-decoration: none; color: inherit; font-size: 1.2em; font-weight: bold; display: block; margin-left: 5px; margin-bottom: 8px; }
        td a:hover { color: #c0392b; transform: scale(1.1); transition: 0.2s; }
        td ul { list-style: none; padding: 0; margin-left: 5px; font-size: 0.75em; text-align: left; color: #666; }
        td ul li { line-height: 1.5; padding: 3px 0; padding-left: 1em; text-indent: -1em; border-top: 1px dashed #eee; }
        .sun { font-weight: bold; color: #a30000; }
        .sat { font-weight: bold; color: #003366; }
        .other-month { color: #ccc !important; background-color: #fafafa; pointer-events: none; opacity: 0.6; }
        .other-month .day-num { color: #ccc; }
        @media (max-width: 600px) {
            body { padding: 10px 5px; }
            table { min-width: 100%; width: 100%; font-size: 11px; margin: 0; }
            td ul { display: block !important; }
            td ul li:nth-child(n+3) { display: none; }
            td ul::after { content: "●"; display: block; text-align: left; font-size: 10px; color: #888; margin-top: 2px; }
        }
        /* ダークモード */
        html.dark { background-color: #1e1e1e; color: #f5f5f5; }
        html.dark h1 { color: #f5f5f5; }
        html.dark table { background-color: #2d2d2d; border-color: #444; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); }
        html.dark th { background-color: #444; border-right-color: #444; color: #fff; }
        html.dark td { border-bottom-color: #444; border-right-color: #444; background-color: #2d2d2d; } 
        html.dark td a { color: #61afef; }
        html.dark .sun, html.dark .sat { background-color: #252525; }
        html.dark td.other-month { background-color: #2d2d2d !important; color: #777777 !important; opacity: 0.5; }
        html.dark .other-month .day-num { color: #777777 !important; }
        html.dark tr:nth-child(even) { background-color: #1e1e1e !important; }
        html.dark td ul li { color: #ffffff !important; }
        html.dark .holiday { border-color: #444 !important; }
        html.dark tr:has(+ tr .holiday) td { border-bottom-color: #444 !important; }
    </style>
</head>
<body>
    <h1>２０２６年５月（JS共通化テスト）</h1>
    <div style="text-align: center; margin-bottom: 20px;">
       <button onclick="toggleDarkMode()" id="darkModeBtn" style="padding: 10px 20px; border-radius: 20px; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #333; font-weight: bold;">
            🌙 ダークモードにする
       </button>
    </div>
    <table>
        <thead>
            <tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr>
        </thead>
        <tbody>
            <tr>
                <td class="other-month"><a href="#" class="date-row"><span class="day-num">26</span></a><ul><li></li></ul></td>
                <td class="other-month"><a href="#" class="date-row"><span class="day-num">27</span></a><ul><li></li></ul></td>
                <td class="other-month"><a href="#" class="date-row"><span class="day-num">28</span></a><ul><li></li></ul></td>
                <td class="other-month"><a href="#" class="date-row"><span class="day-num">29</span></a><ul><li></li></ul></td>
                <td class="other-month"><a href="#" class="date-row"><span class="day-num">30</span></a><ul><li></li></ul></td>
                <!-- 🌟 リンク先が「diary.html?date=日付」になっている点に注目！ -->
                 <td><a href="diary.html?date=2026-05-01" class="date-row"><span class="day-num">1</span></a><ul><li>● 1日を見る</li></ul></td>
                 <td class="sat"><a href="diary.html?date=2026-05-02" class="date-row"><span class="day-num">2</span></a><ul><li>● 2日を見る</li></ul></td>
            </tr>
            <tr>
                <td class="holiday"><a href="diary.html?date=2026-05-03" class="date-row"><span class="day-num">3</span><span class="holiday-name">憲法記念日</span></a></td>
                <td class="holiday"><a href="diary.html?date=2026-05-04" class="date-row"><span class="day-num">4</span><span class="holiday-name">みどりの日</span></a></td>
                <td class="holiday"><a href="diary.html?date=2026-05-05" class="date-row"><span class="day-num">5</span><span class="holiday-name">こどもの日</span></a></td>
                <td class="holiday"><a href="diary.html?date=2026-05-06" class="date-row"><span class="day-num">6</span><span class="holiday-name">振替休日</span></a></td>
                <td><a href="diary.html?date=2026-05-07" class="date-row"><span class="day-num">7</span></a><ul><li>● 7日を見る</li></ul></td>
                <td><a href="diary.html?date=2026-05-08" class="date-row"><span class="day-num">8</span></a><ul><li>● 8日を見る</li></ul></td>
                <td class="sat"><a href="diary.html?date=2026-05-09" class="date-row"><span class="day-num">9</span></a><ul><li>● 9日を見る</li></ul></td>
            </tr>
            <!-- 💡 テスト用として2週目まで記載しています。仕組みが動いたら後からいくらでも増やせます -->
        </tbody>
    </table>
    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            const btn = document.getElementById('darkModeBtn');
            if (isDark) {
                btn.innerHTML = '☀️ ライトモードにする'; btn.style.background = '#333'; btn.style.color = '#fff'; btn.style.borderColor = '#555';                
            } else {
                btn.innerHTML = '🌙 ダークモードにする'; btn.style.background = '#fff'; btn.style.color = '#333'; btn.style.borderColor = '#ddd';
            }
        }
    </script>
</body>
</html>
